spring:
  application:
    name: cv-builder

  datasource:
    url: jdbc:postgresql://localhost:5432/cvbuilder
    username: cvbuilder
    password: cvbuilder_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration




server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    io.github.ghallababdullah.cv_builder: DEBUG

app:
  jwt:
    secret: "MySecretKeyForJwtTokenSigning_MinimumLength32Chars_ChangeInProduction"
    expirationMs: 3600000